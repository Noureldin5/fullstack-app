events {}

http {
  server {
    listen 80;

    # /api/* → backend container
    location /api {
      proxy_pass         http://backend:5000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # everything else → frontend container
    location / {
      proxy_pass         http://frontend:80;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }
  }
}
